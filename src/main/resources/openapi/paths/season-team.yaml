seasonTeam:
  post:
    tags:
      - SeasonTeamManagement
    operationId: createSeasonTeam
    summary: Create a new season team
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeasonTeamCreateRequest'
    responses:
      '201':
        description: Season team created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

seasonTeamById:
  get:
    tags:
      - SeasonTeamManagement
    operationId: getSeasonTeamById
    summary: Get season team details by ID
    parameters:
      - $ref: '#/components/parameters/seasonTeamId'
    responses:
      '200':
        description: Season team created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

  delete:
    tags:
      - SeasonTeamManagement
    operationId: deleteSeasonTeamById
    summary: Delete season team details by ID
    parameters:
      - $ref: '#/components/parameters/seasonTeamId'
    responses:
      '200':
        description: Season team created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

seasonTeamsBySeasonId:
  get:
    tags:
      - SeasonTeamManagement
    operationId: getSeasonTeamsBySeasonId
    summary: Get season teams by season ID
    parameters:
      - $ref: '#/components/parameters/seasonId'
    responses:
      '200':
        description: Season teams fetched successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTeamsResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'


components:
  schemas:
    SeasonTeamBase:
      type: object
      properties:
        seasonId:
          type: integer
          format: int64
          example: 1
        teamId:
          type: integer
          format: int64
          example: 1

    SeasonTeamCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SeasonTeamBase'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1

    SeasonTeamResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        season:
          $ref: './season.yaml#/components/schemas/SeasonSummary'
        team:
          $ref: './team.yaml#/components/schemas/TeamSummary'

    SeasonTeamsResponse:
      type: object
      properties:
        season:
          $ref: './season.yaml#/components/schemas/SeasonSummary'
        teams:
          type: array
          items:
            $ref: './team.yaml#/components/schemas/TeamSummary'


  parameters:
    seasonTeamId:
      name: season-team-id
      in: path
      required: true
      description: Unique identifier for the season team
      schema:
        type: integer
        format: int64
    seasonId:
      name: season-id
      in: path
      required: true
      description: Unique identifier for the season team
      schema:
        type: integer
        format: int64