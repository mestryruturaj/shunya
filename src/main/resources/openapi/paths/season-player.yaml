seasonPlayer:
  post:
    tags:
      - SeasonPlayerManagement
    operationId: createSeasonPlayer
    summary: Create a new season player
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeasonPlayerCreateRequest'
    responses:
      '201':
        description: Tournament Player created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPlayerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

components:
  schemas:
    SeasonPlayerBase:
      type: object
      properties:
        seasonId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
      required:
        - seasonId
        - playerId

    SeasonPlayerCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SeasonPlayerBase'
        - type: object

    SeasonPlayerResponse:
      properties:
        id:
          type: integer
          format: int64
        season:
          $ref: './season.yaml#/components/schemas/SeasonInfo'
        player:
          $ref: './player.yaml#/components/schemas/PlayerInfo'



