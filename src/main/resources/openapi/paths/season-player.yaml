seasonPlayer:
  post:
    tags:
      - SeasonPlayerManagement
    operationId: createSeasonPlayer
    summary: Create a new season player
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeasonPlayerCreateRequest'
    responses:
      '201':
        description: Tournament Player created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPlayerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

seasonPlayerById:
  get:
    tags:
      - SeasonPlayerManagement
    operationId: getSeasonPlayerById
    summary: Get a season player by ID
    parameters:
      - name: season-player-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Tournament Player fetched successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPlayerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'
  delete:
    tags:
      - SeasonPlayerManagement
    operationId: deleteSeasonPlayerById
    summary: Delete season-player by id
    parameters:
      - name: season-player-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Tournament Player fetched successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPlayerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

seasonPlayersBySeasonId:
  get:
    tags:
      - SeasonPlayerManagement
    operationId: getSeasonPlayersBySeasonId
    summary: Get season players by seasonId
    parameters:
      - name: season-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Tournament Players fetched successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPlayersResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'



components:
  schemas:
    SeasonPlayerBase:
      type: object
      properties:
        seasonId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
      required:
        - seasonId
        - playerId

    SeasonPlayerCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SeasonPlayerBase'
        - type: object

    SeasonPlayerResponse:
      properties:
        id:
          type: integer
          format: int64
        season:
          $ref: './season.yaml#/components/schemas/SeasonInfo'
        player:
          $ref: './player.yaml#/components/schemas/PlayerInfo'

    SeasonPlayersResponse:
      properties:
        season:
          $ref: './season.yaml#/components/schemas/SeasonInfo'
        players:
          type: array
          items:
            $ref: './player.yaml#/components/schemas/PlayerInfo'