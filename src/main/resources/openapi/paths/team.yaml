team:
  post:
    tags:
      - TeamManagement
    operationId: createTeam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamCreateRequest'
    responses:
      '201':
        description: Team created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

  get:
    tags:
      - TeamManagement
    operationId: getAllTeams
    responses:
      '200':
        description: List of all teams retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

teamById:
  get:
    tags:
      - TeamManagement
    operationId: getTeamById
    parameters:
      - $ref: '#/components/parameters/teamId'
    responses:
      '200':
        description: Team details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'
  put:
    tags:
      - TeamManagement
    operationId: updateTeamById
    parameters:
      - $ref: '#/components/parameters/teamId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamUpdateRequest'
    responses:
      '200':
        description: Team updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamResponse'
      '400':
          $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
          $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
          $ref: '../components.yaml#/components/responses/InternalServerError'
  delete:
    tags:
      - TeamManagement
    operationId: deleteTeamById
    parameters:
      - $ref: '#/components/parameters/teamId'
    responses:
      '200':
        description: Team details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

components:
  schemas:
    TeamBase:
      type: object
      properties:
        teamName:
          type: string
          example: "Warriors"
        captain:
          type: integer
          format: int64
        viceCaptain:
          type: integer
          format: int64

    TeamCreateRequest:
      allOf:
        - $ref: '#/components/schemas/TeamBase'

    TeamUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TeamBase'

    TeamResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        teamName:
          type: string
          example: "Warriors"
        captain:
          $ref: './player.yaml#/components/schemas/PlayerInfo'
        viceCaptain:
          $ref: './player.yaml#/components/schemas/PlayerInfo'

    TeamInfo:
      allOf:
        - $ref: '#/components/schemas/TeamResponse'

  parameters:
    teamId:
      name: team-id
      in: path
      required: true
      description: Unique identifier for the team
      schema:
        type: integer
        format: int64