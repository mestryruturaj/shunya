organizer:
  post:
    tags:
      - OrganizerManagement
    operationId: createOrganizer
    summary: api to create a organizer
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizerCreateRequest'
    responses:
      '201':
        description: Organizer created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

organizerById:
  get:
    tags:
      - OrganizerManagement
    operationId: getOrganizerById
    parameters:
      - $ref: '#/components/parameters/organizerId'
    responses:
      '200':
        description: Organizer fetched successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'
  delete:
    tags:
      - OrganizerManagement
    operationId: deleteOrganizerById
    parameters:
      - $ref: '#/components/parameters/organizerId'
    responses:
      '200':
        description: Organizer deleted successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'



components:
  schemas:
    OrganizerBase:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 'Lalit Modi'
      required:
        userId

    OrganizerCreateRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/OrganizerBase'

    OrganizerResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/OrganizerBase'
      properties:
        id:
          type: integer
          format: int64

    OrganizerSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string

  parameters:
    organizerId:
      name: organizer-id
      in: path
      schema:
        type: integer
        format: int64
