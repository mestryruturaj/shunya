auction:
  post:
    tags:
      - AuctionManagement
    operationId: createAuction
    summary: Create a new auction
    requestBody:
      description: Auction object that needs to be added
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuctionCreateRequest'
    responses:
      '201':
        description: Season created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

auctionById:
  get:
    tags:
      - AuctionManagement
    operationId: getAuctionById
    parameters:
      - $ref: '#/components/parameters/auctionId'
    responses:
      '200':
        description: Auction details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionResponse'
      '400':
        $ref: '../components.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components.yaml#/components/responses/InternalServerError'

components:
  schemas:
    AuctionBase:
      type: object
      properties:
        tournamentId:
          type: integer
          format: int64
          description: ID of the tournament associated with the auction
        seasonId:
          type: integer
          format: int64
          description: ID of the season associated with the auction
        venue:
          type: string
          description: Venue of the auction
        time:
          type: string
          format: date-time
          description: Scheduled time of the auction
        organizer:
          type: string
          description: Organizer of the auction

    AuctionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AuctionBase'
        - type: object

    AuctionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the auction
        tournament:
          $ref: './tournament.yaml#/components/schemas/TournamentSummary'
        season:
          $ref: './season.yaml#/components/schemas/SeasonSummary'
        venue:
          type: string
          description: Venue of the auction
        time:
          type: string
          format: date-time
          description: Scheduled time of the auction
        organizer:
          type: string
          description: Organizer of the auction

  parameters:
    auctionId:
      name: auction-id
      in: path
      schema:
        type: integer
        format: int64
        example: 1


