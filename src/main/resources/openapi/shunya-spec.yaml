openapi: 3.0.3
info:
  title: Shunya (OTTS) - Auction Engine API
  description: >
    API for a real-time sports auction system featuring dynamic budget 
    guardrails, automated countdowns, and administrative overrides.
  version: 1.0.0
  contact:
    name: Shunya Development Team

servers:
  - url: /shunya
    description: Local Development Server

tags:
  - name: Auth
    description: Identity management (Signup/Login)
  - name: Tournament
    description: Orchestration of sporting events
  - name: Auction
    description: Real-time bidding engine and room logic

# 1. PATHS - Define your endpoints here
paths:
  /auth/signup:
    $ref: './paths/auth.yaml#/signup'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /player:
    $ref: './paths/player.yaml#/player'
  /player/{playerId}:
    $ref: './paths/player.yaml#/playerById'
  /tournament:
    $ref: './paths/tournament.yaml#/tournament'
  /tournament/{tournament-id}:
    $ref: './paths/tournament.yaml#/tournamentById'
  /season:
    $ref: './paths/season.yaml#/season'
  /season/{season-id}:
    $ref: './paths/season.yaml#/seasonById'
  /tournament-player:
    $ref: './paths/tournament-player.yaml#/tournamentPlayer'
  /tournament-player/{tournament-player-id}:
    $ref: './paths/tournament-player.yaml#/tournamentPlayerById'
  /tournament-player/tournament/{tournament-id}:
    $ref: './paths/tournament-player.yaml#/tournamentPlayersByTournamentId'
  /season-player:
    $ref: './paths/season-player.yaml#/seasonPlayer'
  /season-player/{season-player-id}:
    $ref: './paths/season-player.yaml#/seasonPlayerById'
  /season-player/season/{season-id}/player:
    $ref: './paths/season-player.yaml#/seasonPlayersBySeasonId'
  /team:
    $ref: './paths/team.yaml#/team'
  /team/{team-id}:
    $ref: './paths/team.yaml#/teamById'
  /season-team:
    $ref: './paths/season-team.yaml#/seasonTeam'
  /season-team/{season-team-id}:
    $ref: './paths/season-team.yaml#/seasonTeamById'
  /season-team/season/{season-id}/team:
    $ref: './paths/season-team.yaml#/seasonTeamsBySeasonId'
  /auction:
    $ref: './paths/auction.yaml#/auction'
  /auction/{auction-id}:
    $ref: './paths/auction.yaml#/auctionById'
